<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konwerter Kolorów RGB/CMYK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Konwerter Kolorów RGB ↔ CMYK</h1>

    <div>
        <div id="panel-rgb">
            <h2>RGB</h2>
            <div>
                <label for="rgb-r">R:</label>
                <input type="range" id="rgb-r" min="0" max="255" value="0">
                <input type="number" id="txt-rgb-r" min="0" max="255" value="0">
            </div>
            <div>
                <label for="rgb-g">G:</label>
                <input type="range" id="rgb-g" min="0" max="255" value="0">
                <input type="number" id="txt-rgb-g" min="0" max="255" value="0">
            </div>
            <div>
                <label for="rgb-b">B:</label>
                <input type="range" id="rgb-b" min="0" max="255" value="0">
                <input type="number" id="txt-rgb-b" min="0" max="255" value="0">
            </div>
        </div>

        <div id="panel-cmyk">
            <h2>CMYK</h2>
            <div>
                <label for="cmyk-c">C:</label>
                <input type="range" id="cmyk-c" min="0" max="100" value="0" step="0.1">
                <input type="number" id="txt-cmyk-c" min="0" max="100" value="0">
            </div>
            <div>
                <label for="cmyk-m">M:</label>
                <input type="range" id="cmyk-m" min="0" max="100" value="0" step="0.1">
                <input type="number" id="txt-cmyk-m" min="0" max="100" value="0">
            </div>
            <div>
                <label for="cmyk-y">Y:</label>
                <input type="range" id="cmyk-y" min="0" max="100" value="0" step="0.1">
                <input type="number" id="txt-cmyk-y" min="0" max="100" value="0">
            </div>
            <div>
                <label for="cmyk-k">K:</label>
                <input type="range" id="cmyk-k" min="0" max="100" value="0" step="0.1">
                <input type="number" id="txt-cmyk-k" min="0" max="100" value="0">
            </div>
        </div>

        <div>
            <h2>Podgląd</h2>
            <div id="color-preview"></div>
        </div>
    </div>

    <script src="script_rgb.js"></script>
</body>
</html>
